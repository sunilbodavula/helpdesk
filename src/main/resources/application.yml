spring:
  application:
    name: helpdesk

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/helpdesk
    username: helpdesk_user
    password: helpdesk_secure_2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
  error:
    include-binding-errors: always
    include-message: always

logging:
  level:
    org.hibernate.SQL: debug