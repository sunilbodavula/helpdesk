spring:
  application:
    name: helpdesk
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: true
  autoconfiguration:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5434/helpdesk
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: warn

app:
  jwt:
    secret: integration-test-secret-integration-test-secret
    access-token-ttl-minutes: 5

springdoc:
  swagger-ui:
    persist-authorization: true   # keeps your token after a page refresh
    tags-sorter: alpha
    operations-sorter: method