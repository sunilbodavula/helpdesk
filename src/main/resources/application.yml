spring:
  application:
    name: helpdesk

  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk
    username: helpdesk_user
    password: helpdesk_123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate: 
        format-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug